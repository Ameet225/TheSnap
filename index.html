<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title></title>

    <style>
        body {
            margin: 0;
            width: 100vw;
            height: 100vh;

            background-color: #000000;
            color: #ff0000;

            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* Main text */
        .main-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            width: 80%;

            font-size: 48px;
            font-weight: bold;
            text-align: center;
        }

        /* Small text in bottom-right */
        .corner-text {
            position: absolute;
            right: 25px;
            bottom: 20px;

            font-size: 18px;
            font-weight: normal;
            text-align: right;
        }
    </style>
</head>

<body>

    <div class="main-text">
        YOUR MAIN TEXT HERE
    </div>

    <div class="corner-text">
        YOUR SMALL TEXT HERE
    </div>

</body>
</html>
